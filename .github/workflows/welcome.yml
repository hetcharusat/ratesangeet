name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome First Time Contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to Spotify Music Tracker! Thanks for opening your first issue!
            
            We appreciate you taking the time to contribute. A maintainer will review your issue soon.
            
            While you wait:
            - Check out our [Contributing Guide](https://github.com/hetcharusat/ratesangeet/blob/dev/CONTRIBUTING.md)
            - Browse the [Documentation](https://github.com/hetcharusat/ratesangeet/blob/dev/docs/INDEX.md)
            - Join our [Discussions](https://github.com/hetcharusat/ratesangeet/discussions)
            
            Happy coding! 🎵✨
          pr-message: |
            🎉 Congratulations on your first pull request! Thanks for contributing to Spotify Music Tracker!
            
            A maintainer will review your PR soon. In the meantime:
            - Make sure all CI checks pass ✅
            - Respond to any review comments
            - Keep your branch up to date with `dev`
            
            We really appreciate your contribution! 🚀
