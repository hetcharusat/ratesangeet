<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #191414;
      color: #fff;
    }
  </style>
</head>
<body>
  <p>✅ Authentication successful! Redirecting...</p>
  <script>
    // Immediately redirect back to the main app with the callback params
    if (window.location.search || window.location.hash) {
      // Preserve all query params and hash
      const callback = window.location.href;
      console.log('Callback URL:', callback);
      
      // For web, just redirect to root with params so the app can handle it
      window.location.href = '/' + window.location.search + window.location.hash;
    } else {
      // No params, just go home
      window.location.href = '/';
    }
  </script>
</body>
</html>
